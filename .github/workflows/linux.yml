name: Build Linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "linux/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/linux.yml"

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux release
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build linux --release \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Package Linux application
        run: |
          mkdir -p dist/linux
          tar -C build/linux/x64/release -czf dist/linux/phakphum-calendar-linux.tar.gz bundle
          cd dist/linux
          sha256sum phakphum-calendar-linux.tar.gz > SHA256SUMS.txt

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: phakphum-calendar-linux-x64
          path: dist/linux
          if-no-files-found: error
          retention-days: 14
