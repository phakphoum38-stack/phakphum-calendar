name: Temporary PR60 Formatter

on:
  push:
    branches:
      - fix/strict-roster-data-range

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format existing Dart directories
        shell: bash
        run: |
          set -euo pipefail
          targets=(lib test)
          if [[ -d integration_test ]]; then
            targets+=(integration_test)
          else
            echo 'integration_test/ not present; skipping.'
          fi
          dart format "${targets[@]}"

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No formatting changes.'
            exit 0
          fi

          git add lib test
          if [[ -d integration_test ]]; then
            git add integration_test
          fi
          git commit -m 'style: apply Dart formatter to PR #60'
          git push
