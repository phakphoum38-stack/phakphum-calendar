name: Temporary PR60 Formatter

on:
  push:
    branches:
      - fix/strict-roster-data-range

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test integration_test
      - name: Commit formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No formatting changes.'
            exit 0
          fi
          git add lib test integration_test
          git commit -m 'style: apply Dart formatter to PR #60'
          git push
