name: Temporary PR60 Formatter

on:
  push:
    branches:
      - fix/strict-roster-data-range

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Formatting does not require pub dependencies. Avoid `flutter pub get`
      # here because it can rewrite pubspec.lock / analysis_options.yaml and
      # make the formatter commit unrelated files.
      - name: Format existing Dart directories
        shell: bash
        run: |
          set -euo pipefail
          targets=(lib test)
          if [[ -d integration_test ]]; then
            targets+=(integration_test)
          else
            echo 'integration_test/ not present; skipping.'
          fi
          dart format "${targets[@]}"

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- lib test; then
            if [[ -d integration_test ]] && ! git diff --quiet -- integration_test; then
              :
            else
              echo 'No Dart formatting changes.'
              exit 0
            fi
          fi

          git add -u -- lib test
          if [[ -d integration_test ]]; then
            git add -u -- integration_test
          fi

          if git diff --cached --quiet; then
            echo 'No formatter-owned changes to commit.'
            exit 0
          fi

          git commit -m 'style: apply Dart formatter to PR #60'
          git push origin HEAD:fix/strict-roster-data-range
