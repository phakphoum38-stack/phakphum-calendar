name: One-shot roster sync repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Patch roster sync fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/controller/app_controller.dart')
          text = path.read_text()

          old = '''        monthlyRoster = parsedMonthly.sections.isEmpty
            ? MonthlyRosterParseReport.fromShifts(parsed)
            : parsedMonthly;
        _loadedRosterShifts = parsed;
'''

          new = '''        monthlyRoster = parsedMonthly.sections.isEmpty
            ? MonthlyRosterParseReport.fromShifts(parsed)
            : parsedMonthly;

        // The monthly-grid parser is the source of truth for sheets whose
        // roster layout is valid but does not match the legacy row parser.
        // Keep the legacy parser first, then fall back to the monthly grid
        // only when it found no target shifts. Google Sheets remains read-only.
        final monthlyFallback = _monthlyAssignmentsToShifts(
          parsedMonthly,
          searchNames: searchNames,
        );
        final effectiveParsed = parsed.isNotEmpty ? parsed : monthlyFallback;
        _loadedRosterShifts = effectiveParsed;
'''

          if old not in text:
              raise SystemExit('Expected loadRoster block was not found')
          text = text.replace(old, new, 1)

          old2 = '''        _setDefaultSyncDateRange(parsed);
        final rangedParsed = _filterToSyncDateRange(parsed);
'''
          new2 = '''        _setDefaultSyncDateRange(effectiveParsed);
        final rangedParsed = _filterToSyncDateRange(effectiveParsed);
'''
          if old2 not in text:
              raise SystemExit('Expected sync range block was not found')
          text = text.replace(old2, new2, 1)

          marker = '''  List<Shift> _parseAllRosterSnapshots(
'''
          helper = r'''  List<Shift> _monthlyAssignmentsToShifts(
    MonthlyRosterParseReport report, {
    required List<String> searchNames,
  }) {
    final targets = searchNames
        .map(_normalizeRosterSearchName)
        .where((value) => value.isNotEmpty)
        .toSet();
    if (targets.isEmpty) return const [];

    final found = <String, Shift>{};
    for (final assignment in report.assignments) {
      final assigned = assignment.workerName.trim();
      final compactAssigned = _normalizeRosterSearchName(assigned);
      if (assigned.isEmpty ||
          !targets.any(compactAssigned.contains)) {
        continue;
      }

      final rule = _monthlyShiftRule(assignment.rowLabel);
      if (rule == null) continue;

      final start = DateTime(
        assignment.date.year,
        assignment.date.month,
        assignment.date.day,
        rule.startHour,
        rule.startMinute,
      );
      var end = DateTime(
        assignment.date.year,
        assignment.date.month,
        assignment.date.day,
        rule.endHour,
        rule.endMinute,
      );
      if (!end.isAfter(start)) end = end.add(const Duration(days: 1));

      final shift = Shift(
        code: rule.code,
        rowLabel: assignment.rowLabel.trim().isEmpty
            ? rule.code
            : assignment.rowLabel.trim(),
        assignedName: assigned,
        start: start,
        end: end,
        sheetTitle: assignment.sectionTitle,
        cell: assignment.sourceCell,
        category: rule.category,
        sourceColorValue: _parseHexColor(assignment.backgroundColor),
      );
      found.putIfAbsent(shift.sourceKey, () => shift);
    }

    return found.values.toList()
      ..sort((left, right) => left.start.compareTo(right.start));
  }

  String _normalizeRosterSearchName(String value) =>
      value.trim().replaceAll(RegExp(r'\s+'), '').toLowerCase();

  _MonthlyShiftRule? _monthlyShiftRule(String label) {
    final value = label
        .trim()
        .toUpperCase()
        .replaceAll(RegExp(r'[\s.\-_]+'), '');
    if (value == 'GEN') {
      return const _MonthlyShiftRule(
        code: 'UG',
        startHour: 7,
        startMinute: 30,
        endHour: 12,
        endMinute: 0,
        category: ShiftCategory.clinic,
      );
    }
    if (value == 'ER' || value == 'CT') {
      return _MonthlyShiftRule(
        code: 'U$value',
        startHour: 8,
        startMinute: 0,
        endHour: 16,
        endMinute: 0,
        category: ShiftCategory.own,
      );
    }
    if (value.contains('14ชั้น')) {
      return const _MonthlyShiftRule(
        code: 'U14',
        startHour: 7,
        startMinute: 0,
        endHour: 8,
        endMinute: 0,
        category: ShiftCategory.own,
      );
    }

    final threePart = RegExp(r'^P([1-4])(เช้า|บ่าย|ดึก)$').firstMatch(value);
    if (threePart != null) {
      return _monthlyPartRule('P${threePart.group(1)}', threePart.group(2)!);
    }

    for (final base in const ['CTIPD', 'CTER', 'IPD', 'ER']) {
      if (!value.startsWith(base)) continue;
      final period = value.substring(base.length);
      if (period == 'เช้า') {
        return _MonthlyShiftRule(
          code: 'U$base',
          startHour: 8,
          startMinute: 0,
          endHour: 16,
          endMinute: 0,
          category: ShiftCategory.own,
        );
      }
      if (period == 'บ่าย') {
        return _MonthlyShiftRule(
          code: 'A$base',
          startHour: 16,
          startMinute: 0,
          endHour: base == 'ER' ? 0 : 8,
          endMinute: 0,
          category: ShiftCategory.own,
        );
      }
      if (period == 'ดึก' && base == 'ER') {
        return const _MonthlyShiftRule(
          code: 'NER',
          startHour: 0,
          startMinute: 0,
          endHour: 8,
          endMinute: 0,
          category: ShiftCategory.own,
        );
      }
    }
    return null;
  }

  _MonthlyShiftRule _monthlyPartRule(String base, String period) => switch (period) {
    'เช้า' => _MonthlyShiftRule(
      code: 'U$base',
      startHour: 8,
      startMinute: 0,
      endHour: 16,
      endMinute: 0,
      category: ShiftCategory.own,
    ),
    'บ่าย' => _MonthlyShiftRule(
      code: 'A$base',
      startHour: 16,
      startMinute: 0,
      endHour: 0,
      endMinute: 0,
      category: ShiftCategory.own,
    ),
    'ดึก' => _MonthlyShiftRule(
      code: 'N$base',
      startHour: 0,
      startMinute: 0,
      endHour: 8,
      endMinute: 0,
      category: ShiftCategory.own,
    ),
    _ => throw StateError('Unsupported monthly shift period: $period'),
  };

  int? _parseHexColor(String? value) {
    if (value == null || value.isEmpty) return null;
    final normalized = value.replaceFirst('#', '');
    final parsed = int.tryParse(normalized, radix: 16);
    if (parsed == null) return null;
    return normalized.length <= 6 ? parsed : parsed & 0xFFFFFF;
  }

'''
          if marker not in text:
              raise SystemExit('Expected parser marker was not found')
          text = text.replace(marker, helper + marker, 1)

          text = text.replace(
              "final periods = _periodsForShifts(rangedParsed);",
              "final periods = _periodsForShifts(rangedParsed);",
              1,
          )
          path.write_text(text)

      - name: Add helper model
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/controller/app_controller.dart')
          text = path.read_text()
          marker = '''class _ShiftOverride {'''
          if marker not in text:
              raise SystemExit('Expected _ShiftOverride marker was not found')
          model = '''class _MonthlyShiftRule {
  const _MonthlyShiftRule({
    required this.code,
    required this.startHour,
    required this.startMinute,
    required this.endHour,
    required this.endMinute,
    required this.category,
  });

  final String code;
  final int startHour;
  final int startMinute;
  final int endHour;
  final int endMinute;
  final ShiftCategory category;
}

'''
          if 'class _MonthlyShiftRule {' not in text:
              text = text.replace(marker, model + marker, 1)
          path.write_text(text)

      - name: Verify
        run: |
          flutter pub get
          dart format lib/controller/app_controller.dart
          flutter analyze
          flutter test
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No repair changes were necessary.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/controller/app_controller.dart
          git commit -m 'fix(shift-parser): restore roster shifts from monthly grid'
          git push
