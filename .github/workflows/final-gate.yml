name: Final Gate

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Auto Detect CI
      - Build Windows
      - Build and Deploy Web
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: final-gate-main
  cancel-in-progress: false

jobs:
  final-gate:
    name: Analyze + Test + Windows + Web verification
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Wait for all required PASS evidence on the same commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          SHA="$EVENT_SHA"
          if [[ -z "$SHA" ]]; then
            SHA="$(git rev-parse HEAD)"
          fi

          echo "Final-gate commit: $SHA"

          get_successful_run() {
            local workflow="$1"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&head_sha=${SHA}&status=completed&per_page=20" \
              --jq '.workflow_runs[] | select(.conclusion == "success") | .id' \
              | head -n 1
          }

          for attempt in {1..20}; do
            QUALITY_RUN="$(get_successful_run ci-auto-detect.yml || true)"
            WINDOWS_RUN="$(get_successful_run windows.yml || true)"
            WEB_RUN="$(get_successful_run web.yml || true)"

            echo "Evidence check ${attempt}/20"
            echo "Quality:  ${QUALITY_RUN:-PENDING}"
            echo "Windows:  ${WINDOWS_RUN:-PENDING}"
            echo "Website:  ${WEB_RUN:-PENDING}"

            if [[ -n "$QUALITY_RUN" && -n "$WINDOWS_RUN" && -n "$WEB_RUN" ]]; then
              echo "QUALITY PASS: $QUALITY_RUN"
              echo "WINDOWS PASS: $WINDOWS_RUN"
              echo "WEB PASS: $WEB_RUN"
              echo "FINAL PASS"
              exit 0
            fi

            if [[ "$attempt" -lt 20 ]]; then
              sleep 30
            fi
          done

          echo "ERROR: required PASS evidence was not available for commit $SHA within the Final Gate wait window."
          echo "Required: Auto Detect CI + Windows + Web on the same commit."
          exit 1

      - name: Verify supported delivery structure
        shell: bash
        run: |
          set -euo pipefail
          test -d windows
          test -d web
          test -f pubspec.yaml
          test -f .github/workflows/ci-auto-detect.yml
          test -f .github/workflows/windows.yml
          test -f .github/workflows/web.yml
          test -f .github/workflows/final-gate.yml
          test ! -f .github/workflows/flutter-ci.yaml
          test ! -f .github/workflows/flutter-web-deploy.yaml
          test ! -f .github/workflows/android.yml
          test ! -f .github/workflows/ios.yml
          test ! -f .github/workflows/macos.yml
          test ! -f .github/workflows/linux.yml
          echo 'MAIN VERIFIED: Quality + Windows + Web active; Android/iOS/macOS/Linux paused.'
