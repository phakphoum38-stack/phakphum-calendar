name: Final Gate

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build Windows
      - Build and Deploy Web
      - Owner Generated v6^6 Gate
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: final-gate-main
  cancel-in-progress: true

jobs:
  final-gate:
    name: Windows + Web + Capability verification
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Verify required workflows succeeded for the same commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          SHA="$EVENT_SHA"
          if [[ -z "$SHA" ]]; then
            SHA="$(git rev-parse HEAD)"
          fi

          echo "Final-gate commit: $SHA"

          get_successful_run() {
            local workflow="$1"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&head_sha=${SHA}&status=completed&per_page=20" \
              --jq '.workflow_runs[] | select(.conclusion == "success") | .id' \
              | head -n 1
          }

          WINDOWS_RUN="$(get_successful_run windows.yml || true)"
          WEB_RUN="$(get_successful_run web.yml || true)"
          CAPABILITY_RUN="$(get_successful_run owner-generated-v6x6.yml || true)"

          test -n "$WINDOWS_RUN" || { echo 'Windows PASS not found for this commit.'; exit 1; }
          test -n "$WEB_RUN" || { echo 'Website PASS not found for this commit.'; exit 1; }
          test -n "$CAPABILITY_RUN" || { echo 'Owner-generated capability PASS not found for this commit.'; exit 1; }

          echo "Windows PASS: $WINDOWS_RUN"
          echo "Website PASS: $WEB_RUN"
          echo "Capability PASS: $CAPABILITY_RUN"
          echo "FINAL PASS"

      - name: Verify supported delivery structure
        shell: bash
        run: |
          set -euo pipefail
          test -d windows
          test -d web
          test -f pubspec.yaml
          test -f .github/workflows/windows.yml
          test -f .github/workflows/web.yml
          test -f .github/workflows/owner-generated-v6x6.yml
          test ! -f .github/workflows/android.yml
          test ! -f .github/workflows/ios.yml
          test ! -f .github/workflows/macos.yml
          test ! -f .github/workflows/linux.yml
          echo 'MAIN VERIFIED: Windows + Web active; Android/iOS/macOS/Linux paused.'
