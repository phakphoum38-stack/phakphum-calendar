name: Temporary Dart Format Fix

on:
  push:
    branches:
      - fix/web-startup-hang-guard

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/web-startup-hang-guard

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format Dart files
        run: dart format lib test integration_test 2>/dev/null || dart format lib test

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test integration_test 2>/dev/null || git add lib test
          git commit -m "style: apply dart formatter"
          git push origin HEAD:fix/web-startup-hang-guard
