name: Repair Google Sheets picker

on:
  push:
    branches:
      - fix/google-sheets-picker-clean

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply picker state repair
        shell: python
        run: |
          from pathlib import Path

          model = Path('lib/models/saved_sheet.dart')
          text = model.read_text(encoding='utf-8')
          text = text.replace(
              '    this.sheetTitle,\n  });',
              '    this.sheetTitle,\n    this.isActive = false,\n  });',
              1,
          )
          text = text.replace(
              '  final String savedAt;\n',
              '  final String savedAt;\n  final bool isActive;\n',
              1,
          )
          text = text.replace(
              "    'savedAt': savedAt.toIso8601String(),\n",
              "    'savedAt': savedAt.toIso8601String(),\n    'isActive': isActive,\n",
              1,
          )
          old = """      savedAt:\n          DateTime.tryParse(json['savedAt']?.toString() ?? '') ??\n          DateTime.fromMillisecondsSinceEpoch(0),\n    );"""
          new = """      savedAt:\n          DateTime.tryParse(json['savedAt']?.toString() ?? '') ??\n          DateTime.fromMillisecondsSinceEpoch(0),\n      isActive: json['isActive'] == true,\n    );"""
          if old not in text:
              raise SystemExit('saved_sheet.dart: JSON constructor anchor not found')
          text = text.replace(old, new, 1)
          text += """\n\n""" if not text.endswith('\n') else ''
          if 'SavedSheet copyWith({' not in text:
              text = text.rstrip()[:-1] + """\n\n  SavedSheet copyWith({DateTime? savedAt, bool? isActive}) => SavedSheet(\n    ownerAccountId: ownerAccountId,\n    spreadsheetId: spreadsheetId,\n    spreadsheetTitle: spreadsheetTitle,\n    sheetId: sheetId,\n    sheetTitle: sheetTitle,\n    url: url,\n    savedAt: savedAt ?? this.savedAt,\n    isActive: isActive ?? this.isActive,\n  );\n}\n"""
          model.write_text(text, encoding='utf-8')

          controller = Path('lib/controller/app_controller.dart')
          text = controller.read_text(encoding='utf-8')

          old = """    return savedSheets\n        .where((sheet) => sheet.ownerAccountId == accountId)\n        .toList()\n      ..sort((left, right) => right.savedAt.compareTo(left.savedAt));\n  }\n\n  SavedSheet? get currentSourceSheet =>\n      savedSheetsForCurrentAccount.firstOrNull;"""
          new = """    return savedSheets\n        .where((sheet) => sheet.ownerAccountId == accountId)\n        .toList()\n      ..sort((left, right) {\n        if (left.isActive != right.isActive) return left.isActive ? -1 : 1;\n        return right.savedAt.compareTo(left.savedAt);\n      });\n  }\n\n  SavedSheet? get currentSourceSheet =>\n      savedSheetsForCurrentAccount.where((sheet) => sheet.isActive).firstOrNull;"""
          if old not in text:
              raise SystemExit('app_controller.dart: source selection anchor not found')
          text = text.replace(old, new, 1)

          old = """  Future<SavedSheet> _saveSheetReference(\n    String accountId,\n    SheetReference reference,\n  ) async {\n    final saved = SavedSheet(\n      ownerAccountId: accountId,\n      spreadsheetId: reference.spreadsheetId,\n      spreadsheetTitle: reference.spreadsheetTitle,\n      sheetId: reference.sheetId,\n      sheetTitle: reference.sheetTitle,\n      url: reference.url,\n      savedAt: DateTime.now(),\n    );\n    savedSheets.removeWhere((item) => item.key == saved.key);\n    savedSheets.insert(0, saved);\n    await _settingsService.saveSavedSheets(savedSheets);\n    return saved;\n  }"""
          new = """  Future<SavedSheet> _saveSheetReference(\n    String accountId,\n    SheetReference reference, {\n    bool setActive = true,\n  }) async {\n    final saved = SavedSheet(\n      ownerAccountId: accountId,\n      spreadsheetId: reference.spreadsheetId,\n      spreadsheetTitle: reference.spreadsheetTitle,\n      sheetId: reference.sheetId,\n      sheetTitle: reference.sheetTitle,\n      url: reference.url,\n      savedAt: DateTime.now(),\n      isActive: setActive,\n    );\n    if (setActive) {\n      savedSheets = [\n        for (final item in savedSheets)\n          if (item.ownerAccountId == accountId)\n            item.copyWith(isActive: false)\n          else\n            item,\n      ];\n    }\n    savedSheets.removeWhere((item) => item.key == saved.key);\n    savedSheets.insert(0, saved);\n    await _settingsService.saveSavedSheets(savedSheets);\n    return saved;\n  }"""
          if old not in text:
              raise SystemExit('app_controller.dart: save reference anchor not found')
          text = text.replace(old, new, 1)

          old = """      final wasCurrent = currentSourceSheet?.key == sheet.key;\n      savedSheets.removeWhere((item) => item.key == sheet.key);\n      await _settingsService.saveSavedSheets(savedSheets);"""
          new = """      final wasCurrent = currentSourceSheet?.key == sheet.key;\n      savedSheets = [\n        for (final item in savedSheets)\n          if (item.key == sheet.key) item.copyWith(isActive: false) else item,\n      ];\n      await _settingsService.saveSavedSheets(savedSheets);"""
          if old not in text:
              raise SystemExit('app_controller.dart: delete anchor not found')
          text = text.replace(old, new, 1)
          controller.write_text(text, encoding='utf-8')

          test = Path('test/widget_test.dart')
          test.write_text(r'''import 'package:flutter/material.dart';
import 'package:flutter_test/flutter_test.dart';
import 'package:phakphum_calendar/controller/app_controller.dart';
import 'package:phakphum_calendar/core/di/app_dependencies.dart';
import 'package:phakphum_calendar/ui/app_shell.dart';
import 'package:shared_preferences/shared_preferences.dart';

void main() {
  setUp(() => SharedPreferences.setMockInitialValues({}));

  AppController demoController() =>
      AppDependencies.production().createDemoAppController();

  testWidgets('Google Sheets picker entry remains usable on a phone',
      (tester) async {
    await tester.binding.setSurfaceSize(const Size(390, 844));
    addTearDown(() => tester.binding.setSurfaceSize(null));

    final controller = demoController();
    addTearDown(controller.dispose);

    await tester.pumpWidget(ShiftToolsApp(controller: controller));
    await tester.pumpAndSettle();

    expect(find.byType(NavigationBar), findsOneWidget);
    expect(find.text('แหล่งข้อมูลเวร'), findsOneWidget);
    expect(find.text('เลือกไฟล์จาก Google Sheets'), findsOneWidget);
    expect(find.text('ยังไม่ได้เลือกแหล่งข้อมูลเวร'), findsOneWidget);
    expect(find.text('ชื่อที่ต้องค้นหา'), findsOneWidget);
    expect(tester.takeException(), isNull);
  });
}
''', encoding='utf-8')

      - name: Format
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/models/saved_sheet.dart lib/controller/app_controller.dart test/widget_test.dart
      - run: flutter analyze
      - run: flutter test test/saved_sheet_test.dart test/widget_test.dart

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/models/saved_sheet.dart lib/controller/app_controller.dart test/widget_test.dart
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "fix: make SavedSheet activation explicit and restore phone picker test"
          git push origin HEAD:fix/google-sheets-picker-clean
