name: Windows validation gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - fix/google-sheets-picker-clean

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Flutter validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        shell: pwsh
        run: flutter --version

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Pub get
        shell: pwsh
        run: flutter pub get

      - name: Dart format check
        shell: pwsh
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter analyze
        shell: pwsh
        run: flutter analyze

      - name: Flutter tests
        shell: pwsh
        run: flutter test

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'build\windows'
          $exe = Get-ChildItem $root -Filter '*.exe' -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\runner\\Debug\\' } |
            Select-Object -First 1

          if ($null -eq $exe) {
            Write-Host 'No Windows executable was produced.' -ForegroundColor Red
            Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object -First 100 FullName
            exit 1
          }

          Write-Host "Windows executable verified: $($exe.FullName)" -ForegroundColor Green
          Write-Host "Size: $($exe.Length) bytes"

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: phakphum-calendar-windows-release
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 7
