name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Xcode and CocoaPods versions
        run: |
          xcodebuild -version
          pod --version

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Google OAuth for iOS when credentials are available
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
        run: |
          set -euo pipefail

          client_id_ok=false
          server_client_id_ok=false

          if [[ "$GOOGLE_IOS_CLIENT_ID" =~ ^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$ ]]; then
            client_id_ok=true
          fi
          if [[ "$GOOGLE_SERVER_CLIENT_ID" =~ ^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$ ]]; then
            server_client_id_ok=true
          fi

          if [[ "$client_id_ok" == true ]]; then
            if [[ -z "$GOOGLE_REVERSED_CLIENT_ID" ]]; then
              client_prefix="${GOOGLE_IOS_CLIENT_ID%.apps.googleusercontent.com}"
              GOOGLE_REVERSED_CLIENT_ID="com.googleusercontent.apps.${client_prefix}"
            fi
            if [[ ! "$GOOGLE_REVERSED_CLIENT_ID" =~ ^com\.googleusercontent\.apps\.[0-9]+-[A-Za-z0-9_-]+$ ]]; then
              echo "::error::GOOGLE_REVERSED_CLIENT_ID is invalid."
              exit 1
            fi

            /usr/libexec/PlistBuddy -c "Set :GIDClientID $GOOGLE_IOS_CLIENT_ID" ios/Runner/Info.plist
            echo "IOS_OAUTH_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID" >> "$GITHUB_ENV"
            echo "IOS_OAUTH_REVERSED_CLIENT_ID=$GOOGLE_REVERSED_CLIENT_ID" >> "$GITHUB_ENV"

            if [[ "$server_client_id_ok" == true ]]; then
              /usr/libexec/PlistBuddy -c "Set :GIDServerClientID $GOOGLE_SERVER_CLIENT_ID" ios/Runner/Info.plist
              echo "IOS_OAUTH_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID" >> "$GITHUB_ENV"
            else
              echo "IOS_OAUTH_SERVER_CLIENT_ID=" >> "$GITHUB_ENV"
              echo "::warning::Google server client ID is not configured; iOS build will continue without backend OAuth audience."
            fi

            echo "IOS_OAUTH_CONFIGURED=true" >> "$GITHUB_ENV"
            echo "Google OAuth credentials detected; embedding iOS OAuth configuration."
          else
            echo "IOS_OAUTH_CLIENT_ID=" >> "$GITHUB_ENV"
            echo "IOS_OAUTH_SERVER_CLIENT_ID=" >> "$GITHUB_ENV"
            echo "IOS_OAUTH_REVERSED_CLIENT_ID=" >> "$GITHUB_ENV"
            echo "IOS_OAUTH_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "::warning::GOOGLE_IOS_CLIENT_ID is not configured. Building an unsigned sideload IPA with Google Login disabled until OAuth is configured."
          fi

      - name: Build unsigned iOS application
        run: |
          set -euo pipefail
          args=(flutter build ios --release --no-codesign)
          if [[ "$IOS_OAUTH_CONFIGURED" == true ]]; then
            args+=("--dart-define=GOOGLE_IOS_CLIENT_ID=$IOS_OAUTH_CLIENT_ID")
            if [[ -n "$IOS_OAUTH_SERVER_CLIENT_ID" ]]; then
              args+=("--dart-define=GOOGLE_SERVER_CLIENT_ID=$IOS_OAUTH_SERVER_CLIENT_ID")
            fi
          fi
          "${args[@]}"

      - name: Verify embedded iOS application configuration
        run: |
          set -euo pipefail
          plist="build/ios/iphoneos/Runner.app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "com.phakphoum.phakphumCalendar"

          if [[ "$IOS_OAUTH_CONFIGURED" == true ]]; then
            test "$(/usr/libexec/PlistBuddy -c 'Print :GIDClientID' "$plist")" = "$IOS_OAUTH_CLIENT_ID"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$plist")" = "$IOS_OAUTH_REVERSED_CLIENT_ID"
            if [[ -n "$IOS_OAUTH_SERVER_CLIENT_ID" ]]; then
              test "$(/usr/libexec/PlistBuddy -c 'Print :GIDServerClientID' "$plist")" = "$IOS_OAUTH_SERVER_CLIENT_ID"
            fi
          else
            echo "OAuth configuration not embedded; sideload build remains valid for local/offline features."
          fi

      - name: Package unsigned IPA
        run: |
          mkdir -p dist/ios/Payload
          ditto build/ios/iphoneos/Runner.app dist/ios/Payload/Runner.app
          cd dist/ios
          ditto -c -k --sequesterRsrc --keepParent Payload phakphum-calendar-unsigned.ipa
          shasum -a 256 phakphum-calendar-unsigned.ipa > SHA256SUMS.txt

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: phakphum-calendar-ios-unsigned
          path: |
            dist/ios/phakphum-calendar-unsigned.ipa
            dist/ios/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
