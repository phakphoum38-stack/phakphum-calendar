name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Xcode and CocoaPods versions
        run: |
          xcodebuild -version
          pod --version

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Google OAuth for iOS
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
        run: |
          set -euo pipefail

          if [[ ! "$GOOGLE_IOS_CLIENT_ID" =~ ^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "::error::GOOGLE_IOS_CLIENT_ID is missing or invalid. Create an iOS OAuth client for bundle ID com.phakphoum.phakphumCalendar."
            exit 1
          fi
          if [[ ! "$GOOGLE_SERVER_CLIENT_ID" =~ ^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "::error::GOOGLE_SERVER_CLIENT_ID and GOOGLE_WEB_CLIENT_ID are missing or invalid."
            exit 1
          fi

          if [[ -z "$GOOGLE_REVERSED_CLIENT_ID" ]]; then
            client_prefix="${GOOGLE_IOS_CLIENT_ID%.apps.googleusercontent.com}"
            GOOGLE_REVERSED_CLIENT_ID="com.googleusercontent.apps.${client_prefix}"
          fi
          if [[ ! "$GOOGLE_REVERSED_CLIENT_ID" =~ ^com\.googleusercontent\.apps\.[0-9]+-[A-Za-z0-9_-]+$ ]]; then
            echo "::error::GOOGLE_REVERSED_CLIENT_ID is invalid."
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set :GIDClientID $GOOGLE_IOS_CLIENT_ID" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :GIDServerClientID $GOOGLE_SERVER_CLIENT_ID" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $GOOGLE_REVERSED_CLIENT_ID" ios/Runner/Info.plist

          echo "IOS_OAUTH_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID" >> "$GITHUB_ENV"
          echo "IOS_OAUTH_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID" >> "$GITHUB_ENV"
          echo "IOS_OAUTH_REVERSED_CLIENT_ID=$GOOGLE_REVERSED_CLIENT_ID" >> "$GITHUB_ENV"

      - name: Build unsigned iOS application
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$IOS_OAUTH_CLIENT_ID" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$IOS_OAUTH_SERVER_CLIENT_ID"

      - name: Verify embedded iOS OAuth configuration
        run: |
          set -euo pipefail
          plist="build/ios/iphoneos/Runner.app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "com.phakphoum.phakphumCalendar"
          test "$(/usr/libexec/PlistBuddy -c 'Print :GIDClientID' "$plist")" = "$IOS_OAUTH_CLIENT_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :GIDServerClientID' "$plist")" = "$IOS_OAUTH_SERVER_CLIENT_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$plist")" = "$IOS_OAUTH_REVERSED_CLIENT_ID"

      - name: Package unsigned IPA
        run: |
          mkdir -p dist/ios/Payload
          ditto build/ios/iphoneos/Runner.app dist/ios/Payload/Runner.app
          cd dist/ios
          ditto -c -k --sequesterRsrc --keepParent Payload phakphum-calendar-unsigned.ipa
          shasum -a 256 phakphum-calendar-unsigned.ipa > SHA256SUMS.txt

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: phakphum-calendar-ios-unsigned
          path: |
            dist/ios/phakphum-calendar-unsigned.ipa
            dist/ios/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
