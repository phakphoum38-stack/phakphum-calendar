name: Format PR60 test

on:
  push:
    branches:
      - fix/strict-roster-data-range
    paths:
      - test/off_after_cross_month_roster_boundary_test.dart
      - .github/workflows/format-pr60.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format target test
        run: dart format test/off_after_cross_month_roster_boundary_test.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/off_after_cross_month_roster_boundary_test.dart
          git commit -m "style: format PR60 regression test"
          git push origin HEAD:fix/strict-roster-data-range
