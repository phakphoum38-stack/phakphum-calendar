name: Validate Flutter

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/**"

permissions:
  contents: read

env:
  MIN_COVERAGE_PERCENT: ${{ vars.MIN_COVERAGE_PERCENT || '60' }}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage --reporter expanded

      - name: Enforce minimum line coverage
        shell: bash
        run: |
          awk -F: -v minimum="$MIN_COVERAGE_PERCENT" '
            /^LF:/ { total += $2 }
            /^LH:/ { covered += $2 }
            END {
              if (total == 0) {
                print "No coverable lines found in coverage/lcov.info."
                exit 1
              }
              percentage = 100 * covered / total
              printf "Line coverage: %.2f%% (%d/%d); required: %.2f%%\n", percentage, covered, total, minimum
              if (percentage + 0.000001 < minimum) exit 1
            }
          ' coverage/lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: Dependency vulnerability scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --lockfile=pubspec.lock
      upload-sarif: false
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write

  static-security:
    name: Static security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Scan repository secrets and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
