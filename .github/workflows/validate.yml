name: Validate Flutter

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/**"

permissions:
  contents: write

env:
  MIN_COVERAGE_PERCENT: ${{ vars.MIN_COVERAGE_PERCENT || '60' }}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-pr60:
    name: Apply PR60 range fix
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch controller and clean temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/controller/app_controller.dart')
          text = path.read_text()
          old = """    _replaceLegacyShifts(\n      _alertService.addOffDutyPeriods(\n        _applyReferenceRelationships(\n          _filterToSyncDateRange(_loadedRosterShifts),\n        ),\n      ),\n    );"""
          new = """    _replaceLegacyShifts(\n      _filterToSyncDateRange(\n        _alertService.addOffDutyPeriods(\n          _applyReferenceRelationships(\n            _filterToSyncDateRange(_loadedRosterShifts),\n          ),\n        ),\n      ),\n    );"""
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Target range-filter block was not found')
          PY
          dart format lib/controller/app_controller.dart test/off_after_cross_month_roster_boundary_test.dart
          git fetch origin main
          git checkout origin/main -- .github/workflows/validate.yml
          rm -f .github/workflows/fix-pr60-range.yml

      - name: Commit fix to PR branch
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/controller/app_controller.dart test/off_after_cross_month_roster_boundary_test.dart .github/workflows/validate.yml .github/workflows/fix-pr60-range.yml
          git commit -m "Fix generated OFF range filtering"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  validate:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test 2>/dev/null || dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage --reporter expanded

      - name: Enforce minimum line coverage
        shell: bash
        run: |
          awk -F: -v minimum="$MIN_COVERAGE_PERCENT" '
            /^LF:/ { total += $2 }
            /^LH:/ { covered += $2 }
            END {
              if (total == 0) {
                print "No coverable lines found in coverage/lcov.info."
                exit 1
              }

              percentage = 100 * covered / total
              printf "Line coverage: %.2f%% (%d/%d); required: %.2f%%\n",
                percentage, covered, total, minimum

              if (percentage + 0.000001 < minimum) {
                exit 1
              }
            }
          ' coverage/lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: Dependency vulnerability scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --lockfile=pubspec.lock
      upload-sarif: false
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write

  static-security:
    name: Static security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Scan repository secrets and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
