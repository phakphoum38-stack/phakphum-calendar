name: Build Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "windows/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: flutter build windows --release --dart-define=GOOGLE_SERVER_CLIENT_ID="$env:GOOGLE_SERVER_CLIENT_ID"

      - name: Package Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/windows -Force | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/windows/phakphum-calendar-windows.zip -Force
          $hash = (Get-FileHash dist/windows/phakphum-calendar-windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  phakphum-calendar-windows.zip" | Set-Content dist/windows/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: phakphum-calendar-windows-x64
          path: dist/windows
          if-no-files-found: error
          retention-days: 14

  # Android, iOS, macOS and Linux are intentionally paused. Their workflow
  # files remain in the repository so they can be restored when needed.
