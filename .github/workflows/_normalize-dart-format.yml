name: Normalize Dart formatting

on:
  push:
    branches:
      - chore/normalize-dart-format-ci
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format Dart sources
        run: dart format lib test integration_test

      - name: Commit formatting only when needed
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test integration_test
          git commit -m "style: normalize Dart formatting"
          git push origin HEAD:chore/normalize-dart-format-ci
