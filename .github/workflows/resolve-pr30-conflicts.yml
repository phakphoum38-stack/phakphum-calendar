name: Resolve PR30 against main

on:
  push:
    branches:
      - codex/update-timeline-source-selection-options
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resolve-pr30
  cancel-in-progress: true

jobs:
  resolve-and-validate:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/update-timeline-source-selection-options
          fetch-depth: 0

      - name: Configure git
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch current main
        shell: pwsh
        run: git fetch origin main

      - name: Merge main and resolve known conflicts
        shell: pwsh
        run: |
          git merge origin/main --no-edit
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Merge reported conflicts; applying intentional ownership rules." -ForegroundColor Yellow

            # Product implementation stays from this PR.
            git checkout --ours -- lib/controller/app_controller.dart lib/ui/app_shell.dart

            # CI/workflow infrastructure stays aligned with current main.
            git checkout --theirs -- .github/workflows/desktop.yml .github/workflows/validate.yml

            # Resolve any remaining known merge state explicitly.
            git add lib/controller/app_controller.dart lib/ui/app_shell.dart .github/workflows/desktop.yml .github/workflows/validate.yml

            $remaining = git diff --name-only --diff-filter=U
            if ($remaining) {
              Write-Host "Unresolved files remain:" -ForegroundColor Red
              $remaining
              exit 1
            }

            git commit -m "chore: resolve PR30 conflicts against main"
          }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Pub get
        shell: pwsh
        run: flutter pub get

      - name: Diff check
        shell: pwsh
        run: git diff --check HEAD~1 HEAD

      - name: Dart format check
        shell: pwsh
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter analyze
        shell: pwsh
        run: flutter analyze

      - name: Flutter tests
        shell: pwsh
        run: flutter test

      - name: Windows release build
        shell: pwsh
        run: flutter build windows --release

      - name: Push resolved branch
        shell: pwsh
        run: git push origin HEAD:codex/update-timeline-source-selection-options
